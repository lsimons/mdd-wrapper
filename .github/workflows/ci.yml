name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes; don't leave the token in .git/config (zizmor artipacked).
          persist-credentials: false

      - name: Checkout mdd
        # pyproject.toml's [tool.uv.sources] points `mdd` at a sibling
        # checkout; CI needs that checkout to exist too.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schubergphilis/mdd
          path: ../mdd
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Install
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test
