name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes; don't leave the token in .git/config (zizmor artipacked).
          persist-credentials: false

      - name: Checkout mdd
        # pyproject.toml's [tool.uv.sources] points `mdd` at a sibling
        # checkout; CI needs that checkout to exist too. actions/checkout
        # refuses a `path` outside the workspace root, so clone directly.
        run: git clone --depth 1 https://github.com/schubergphilis/mdd.git ../mdd

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      - name: Audit workflows
        env:
          # zizmor's impostor-commit and known-vulnerable-actions audits are
          # online; without a token they are skipped rather than passed.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit
