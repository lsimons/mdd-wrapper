name: Live sync

# The public end-to-end test of the mirror seam: pull a real Confluence
# space through the sync engine and push the Markdown mirror to a real
# GitHub repository, using the GitHubBackend this wrapper provides.
#
# SAFETY (mdd spec S44): the two credentials this job holds must never be
# able to reach an internal system.
#
#   CONFLUENCE_API_TOKEN — scoped to the `markdown.atlassian.net` sandbox
#                          only. Not a corporate Atlassian token.
#   MIRROR_TOKEN         — a fine-grained GitHub PAT with Contents:write
#                          on `lsimons/test-confluence-MDD` and nothing
#                          else.
#
# GitHubBackend.guard_remote independently refuses to push anywhere other
# than the configured owner, so a misconfigured remote fails closed rather
# than writing somewhere unintended.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Reconcile and report without writing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: live-sync
  cancel-in-progress: false

env:
  CONFLUENCE_SPACE: MDD
  MIRROR_REPO: lsimons/test-confluence-MDD

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials are configured
        id: creds
        env:
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$CONFLUENCE_API_TOKEN" ] || [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::live-sync secrets are not configured; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout wrapper
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        if: steps.creds.outputs.ready == 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: mise run install

      - name: Write Confluence config
        if: steps.creds.outputs.ready == 'true'
        env:
          CONFLUENCE_USERNAME: ${{ vars.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          mkdir -p configs
          # Written with a heredoc rather than interpolated into YAML by
          # the runner, so the token never appears in the rendered
          # workflow or in the step's command line.
          {
            echo "confluence:"
            echo "  url: https://markdown.atlassian.net"
            echo "  username: ${CONFLUENCE_USERNAME}"
            echo "  api_token: ${CONFLUENCE_API_TOKEN}"
          } > configs/confluence.yaml

      - name: Clone the mirror
        if: steps.creds.outputs.ready == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" mirror
          git -C mirror config user.name "mdd-wrapper live-sync"
          git -C mirror config user.email "noreply@github.com"

      - name: Sync the space
        if: steps.creds.outputs.ready == 'true'
        env:
          MDD_WRAPPER_GITHUB_OWNER: lsimons
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run mdd confluence sync-space "$CONFLUENCE_SPACE" --output mirror --dry-run
          else
            uv run mdd confluence sync-space "$CONFLUENCE_SPACE" --output mirror --push
          fi

      - name: Scrub the credential from the work-tree
        if: always() && steps.creds.outputs.ready == 'true'
        run: |
          rm -f configs/confluence.yaml
          git -C mirror remote set-url origin "https://github.com/${MIRROR_REPO}.git" || true
