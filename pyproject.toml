[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdd-wrapper"
version = "0.1.0"
description = "Reference wrapper for mdd: a GitHub mirror backend behind the MirrorBackend seam"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mdd"]
authors = [{ name = "lsimons" }]

[project.scripts]
# This wrapper is the only distribution installed as a tool, so it may
# safely claim the `mdd` name: an isolated tool install exposes scripts
# from the named package only. A wrapper that has to coexist with another
# claimant must not — `uv` resolves a same-name collision by alphabetical
# distribution name, not by which package you installed, so the winner is
# not the one you'd expect. Such a wrapper should have its installer own
# `bin/mdd` explicitly. See the README.
mdd = "mdd_wrapper.cli:main"

[tool.uv.sources]
# Local development:
mdd = { path = "../mdd", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdd_wrapper*"]

[tool.setuptools.package-data]
# The skills bundle is data, not a package — no `__init__.py` — so
# `packages.find` will not pick it up. Without this the wheel builds
# fine and `mdd skills list` finds nothing at runtime, which is the
# failure a wrapper is most likely to ship by accident.
mdd_wrapper = ["skills/*/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C90", "PLC0415", "RUF", "PTH", "TC", "PT", "ARG", "S"]
ignore = [
    "S404",  # `import subprocess` — this wrapper orchestrates git by design
    "S603",  # subprocess call — argv lists, never an untrusted shell string
    "S607",  # partial executable path — `git` resolved via PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".venv/**", "**/__pycache__/**"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.21", "basedpyright>=1.39.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
